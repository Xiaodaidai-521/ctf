version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: ctf-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ctf_platform
      - POSTGRES_USER=ctf_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ctf-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 挂载媒体文件
      - ./backend/media:/app/media
      # 挂载 Django 静态文件，供前端 Nginx 读取
      - ./backend/staticfiles:/app/staticfiles
      # 挂载日志文件
      - ./backend/logs:/app/logs
      # 挂载 Docker socket（用于容器管理 - 注意安全风险）
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
      # 数据库（PostgreSQL）
      - DATABASE_URL=postgres://ctf_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ctf_platform
      # AI 配置
      # FRP 配置
      - FRP_API_URL=http://frp-server:7500
      - FRP_HTTP_DOMAIN=${FRP_HTTP_DOMAIN:-ctf.local}
      - FRP_HTTP_PORT=9123
      # CORS（生产环境填实际域名，如 https://ctf.example.com）
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # 管理员账户（首次启动自动创建）
      - DJANGO_SUPERUSER_USERNAME=${ADMIN_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Gunicorn 配置
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    depends_on:
      postgres:
        condition: service_healthy
      frp-server:
        condition: service_started
    networks:
      - ctf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ctf-frontend
    ports:
      - "80:80"
    volumes:
      - ./backend/media:/usr/share/nginx/media:ro
      - ./backend/staticfiles:/usr/share/nginx/static:ro
    depends_on:
      - backend
    networks:
      - ctf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FRP 服务器（用于容器题目代理）
  frp-server:
    image: snowdreamtech/frps:0.52.3
    container_name: frp-server
    ports:
      - "7500:7500"   # API/管理端口
      - "7000:7000"   # FRP bind 端口
      - "9123:9123"   # HTTP 代理端口
    volumes:
      - ./frp/frps.ini:/etc/frp/frps.ini
    networks:
      - ctf-network
    restart: unless-stopped

networks:
  ctf-network:
    driver: bridge

volumes:
  postgres_data:
