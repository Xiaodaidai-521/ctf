# NON-DEPLOYABLE template. Compose requires FRPS_CONFIG_FILE outside the repository.
# The operator must render and protect that file (0400/0600) using independent
# approved references, and keep it out of images/evidence. No production FRP has
# been contacted; removing old source values does not revoke or rotate credentials.
[common]
bind_addr = 127.0.0.1
bind_port = 7000
# Values come from the authorized external renderer, never source defaults.
token = {{ .Envs.FRP_TOKEN }}

vhost_http_port = 9123
dashboard_addr = 127.0.0.1
dashboard_port = 7500
dashboard_user = {{ .Envs.FRP_DASHBOARD_USER }}
dashboard_pwd = {{ .Envs.FRP_DASHBOARD_PASSWORD }}

log_file = /var/log/frps/frps.log
log_level = info
log_max_days = 7
max_pool_count = 50
max_ports_per_client = 10
authentication_timeout = 900
