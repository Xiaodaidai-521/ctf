[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-data-security"
version = "0.5.0"
description = "Same-process data security contracts, pure core and explicit adapters"
requires-python = ">=3.11"
dependencies = ["cryptography==44.0.0", "openpyxl==3.1.5", "defusedxml==0.7.1", "python-magic==0.4.27"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["data_security*", "mainline1*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
mainline1 = ["config/*.json"]
