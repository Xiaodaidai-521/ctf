server {
    # Request targets and upstream error text are not approved log fields.
    access_log off;
    error_log /dev/null;
    listen 80;
    server_name ctf.local;
    return 308 https://$host$request_uri;
}

# Optional standalone challenge edge; mount the same external TLS directory.
server {
    # Request targets and upstream error text are not approved log fields.
    access_log off;
    error_log /dev/null;
    listen 443 ssl;
    server_name ctf.local;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;

    # CTF挑战路径代理
    location /challenge/ {
        # 移除/challenge/前缀，转发到FRP服务器
        rewrite ^/challenge/(.*)$ /$1 break;
        proxy_pass http://frps-server:9123/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SSL "";
        proxy_set_header X-Forwarded-Protocol "";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Strict-Transport-Security "max-age=300" always;
    }
}
