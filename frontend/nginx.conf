server {
    # Request targets and upstream error text are not approved log fields.
    access_log off;
    error_log /dev/null;
    listen 80;
    server_name localhost;
    return 308 https://$host$request_uri;
}

server {
    # Request targets and upstream error text are not approved log fields.
    access_log off;
    error_log /dev/null;
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    root /usr/share/nginx/html;
    index index.html;
    # 50 MiB resource + 5 MiB cover + multipart framing; Django enforces each limit.
    client_max_body_size 56m;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the entry document after a frontend replacement.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cache-Control "no-cache";
    }

    # Numeric /challenge/:id URLs belong to Vue and use the SPA fallback above.
    # Keep this before the static-file regex so container CSS/JS also go upstream.
    location ~ ^/challenge/[0-9]+-[A-Za-z0-9-]+(?:/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SSL "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cache-Control "public, immutable";
    }

    # API代理到后端
    location ^~ /api/ {
        # Stream private uploads/downloads without plaintext proxy temporary files.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SSL "";
        proxy_set_header X-Forwarded-Protocol "";
    }

    location ^~ /media/resources/ {
        return 404;
    }

    location ^~ /media/resource_covers/ {
        return 404;
    }

    location ^~ /media/feedback_evidence/ {
        return 404;
    }

    # 媒体文件由 Nginx 直接服务
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cache-Control "public";
    }

    # Django 静态文件由 Nginx 直接服务
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cache-Control "public, immutable";
    }

}
